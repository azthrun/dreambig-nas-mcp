name: CI

# PRs: integration tests + image build + smoke test.
# main: the same, then push the image to GHCR.
# No workflow uploads artifacts; caches are kept small (npm cache, min-mode Docker layer cache).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/azthrun/dreambig-nas-mcp
  # docker/build-push-action would otherwise upload a build record artifact.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          rm .env

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=min

      - name: Smoke test image
        run: scripts/smoke-test.sh "$IMAGE:ci"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          short_sha="${GITHUB_SHA::7}"
          for tag in latest "sha-$short_sha"; do
            docker tag "$IMAGE:ci" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
